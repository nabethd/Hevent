name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # A freshly generated key every run means every APK has a different signature, and Android
      # refuses to install one over another ("App not installed"). Set the DEBUG_KEYSTORE_BASE64
      # repository secret to keep the signature stable so builds upgrade in place:
      #   base64 -i debug.keystore | pbcopy
      - name: Restore or generate debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored debug.keystore from secret (stable signature)."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret set. This APK is signed with a throwaway key and cannot be installed over a previous build."
          fi

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Test Report On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7

      # The debug APK is ~17 MB: debug builds never run R8 and bundle the Compose tooling.
      # This is the same app shrunk, signed with the same key so it upgrades in place.
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          KEY_ALIAS: androiddebugkey
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Report APK sizes
        run: |
          {
            echo "| build | size |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
              [ -f "$f" ] && printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Listed first so it is the obvious one to download.
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
